controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    robotiq_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

gz_ros_control:
  ros__parameters:
    # Position commands in Gazebo should be applied without the very slow
    # default 0.1 low-pass response; the trajectory controller already
    # performs interpolation and enforces path/goal tolerances.
    position_proportional_gain: 1.0

joint_state_broadcaster:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      - robotiq_85_left_knuckle_joint
    interfaces: [position, velocity]

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 10.0
      # Gazebo's position-system backend follows the interpolated target with
      # a phase lag during large sweeps. Do not abort mid-path for that lag;
      # Gazebo's gravity-loaded position system settles with roughly 0.13 rad
      # error on the elbow/wrist at the low tabletop grasp pose.
      shoulder_pan_joint: {trajectory: 0.0, goal: 0.2}
      shoulder_lift_joint: {trajectory: 0.0, goal: 0.2}
      elbow_joint: {trajectory: 0.0, goal: 0.2}
      wrist_1_joint: {trajectory: 0.0, goal: 0.2}
      wrist_2_joint: {trajectory: 0.0, goal: 0.2}
      wrist_3_joint: {trajectory: 0.0, goal: 0.2}

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 10.0
      shoulder_pan_joint: {trajectory: 0.0, goal: 0.1}
      shoulder_lift_joint: {trajectory: 0.0, goal: 0.1}
      elbow_joint: {trajectory: 0.0, goal: 0.1}
      wrist_1_joint: {trajectory: 0.0, goal: 0.1}
      wrist_2_joint: {trajectory: 0.0, goal: 0.1}
      wrist_3_joint: {trajectory: 0.0, goal: 0.1}

robotiq_gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    state_interfaces: [position, velocity]
    allow_stalling: true
    stall_timeout: 0.5
    goal_tolerance: 0.02
